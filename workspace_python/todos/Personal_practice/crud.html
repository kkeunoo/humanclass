<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>

        <style>
            .table tr td {
                /* border: 1px solid red; */
                width: 100px;
                text-align: center;
            }

            .hide {
                display: none;
            }
        </style>

    </head>
    <body>
        <h1>등록 - post/ajax</h1>
        <form id="form1" method="post" action="http://localhost:8000/practice/c">
            아이디 : <input type="text" name="id" id="id"><br>
            아이템 : <input type="text" name="item" id="item"><br>
            <input type="submit" value="등록[POST]"><br>
        </form>
        <h1>전체불러오기 - post/ajax</h1>
        <input type="button" value="전체 불러오기[GET]" id="readAll">
        <table border=1 class="table">
            <thead>
                <tr>
                    <td>ID</td>
                    <td>ITEM</td>
                </tr>
            </thead>
            <tbody class="tbody">

            </tbody>
        </table>

        <h1>상세내역보기 - post/ajax</h1>
        <div id="detail"></div>

        <script>
            form = document.querySelector('#form1')
            submit = document.querySelector('#form1 [type=submit]')

            submit.addEventListener('click', function(event){
                event.preventDefault()

                id = document.querySelector('#id')
                item = document.querySelector('#item')
                
                url = 'http://localhost:8000/practice/c'
                param = {
                    id : id.value,
                    item : item.value
                }

                fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type' : 'application/json'
                    },
                    body: JSON.stringify(param)
                }).then(function(){
                    readAll = document.querySelector('#readAll').click()
                })
            })

            readAll = document.querySelector('#readAll')
            readAll.addEventListener('click', function(){

                url = 'http://localhost:8000/practice/r'

                fetch(url, {
                    method: 'GET'
                }).then(function(response){
                    return response.json()
                }).then(function(data){
                    console.log(data)

                    tbody = document.querySelector('.tbody')
                    tbody.innerHTML = ''
                    
                    for(let i=0; i<data.length; i++) {
                        id = data[i].id
                        item = data[i].item
                        
                        tr = document.createElement('tr')
                        tr.innerHTML = `
                            <td class="id" data-id="${id}">${id}</td>
                            <td>${item}</td>
                        `

                        tr.querySelector('.id').addEventListener('click',function(event){
                            id = event.target.getAttribute('data-id')

                            const xhr = new XMLHttpRequest()
                            xhr.open('get', 'http://localhost:8000/practice/r/' + id)
                            xhr.send()
                            xhr.onload = function(){
                                data = JSON.parse(xhr.responseText)

                                detail = document.querySelector('#detail')
                                detail.innerHTML = `
                                    ID : ${data.id}<br>
                                    ITEM : ${data.item}<br>
                                `

                                detail.setAttribute('data-id', data.id)
                            }
                        })
                        tbody.append(tr)
                    }
                })
            })

        </script>
    </body>
</html>
