<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
        }

        .container {
            /* border: 1px solid red; */
            height: 100vh;
            display: flex;
            text-align: center;
            align-items: center;
            justify-content: center;
        }

        .container #form1 {
            border: 5px solid lightblue;
            border-radius: 10px;
            width: 500px;
            /* height: 300px; */
        }

        .container #form1 #tableDiv {
            display: flex;
            text-align: center;
            justify-content: center;
        }

        .container #form1 #tableDiv #listTable {
            border-collapse: collapse;
        }

        .container #form1 #tableDiv #listTable,
        .container #form1 #tableDiv #listTable th,
        .container #form1 #tableDiv #listTable td {
            border: 2px solid black;
        }

        .container #form1 #btnDiv {
            margin: 20px;
        }

        .container #form1 #btnDiv #add {
            width: 410px;
            border: 1px solid black;
            border-radius: 10px;
        }

        .container #form1 #btnDiv #add:hover {
            width: 205px;
            cursor: pointer;
            font-weight: bold;
            /* transform: translate(0, -5px); */
            transition: 1s;

        }

        #listTable .thID {
            width: 100px;
        }

        #listTable .thITEM {
            width: 300px;
        }
    </style>
</head>
<body>
    <div class="container">
        <form id="form1">
            <h1>전체 목록 페이지</h1>
            <div id="tableDiv">
                <table border=1 id="listTable">
                    <thead>
                        <tr>
                            <th colspan="2">전체 목록</th>
                        </tr>
                        <tr>
                            <th class="thID">ID</th>
                            <th class="thITEM">ITEM</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% if list %}
                            {% for li in list %}
                            <tr>
                                <td>
                                    <a href="http://127.0.0.1:8000/detail?id={{ li.id }}&item={{ li.item }}">
                                        {{ li.id }}
                                    </a>
                                </td>
                                <td>
                                    {{ li.item }}
                                </td>
                            </tr>
                            {% endfor %}
                        {% else %}
                            <tr>
                                <td colspan="2">자료가 없습니다.</td>
                            </tr>
                        {% endif %}
                    </tbody>
                </table>
            </div>
            <div id="btnDiv">
                <a href="http://127.0.0.1:8000/create">
                    <input type="button" value="추가" name="add" id="add">
                </a>
            </div>
            
        </form>
    </div>
</body>
</html>
