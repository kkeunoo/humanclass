<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><title>15-02. 키보드와 스크롤 — 키의 정보에서 위치 변경까지</title><style>body { min-height: 250vh; } #game { position: relative; width: 100px; height: 40px; background: lightblue; } #top { position: fixed; right: 10px; bottom: 10px; }</style></head>
<body>
    <h1>15-02. 키보드와 스크롤 — 키의 정보에서 위치 변경까지</h1>
    <p>개발자 도구의 Console을 열어 결과를 확인하세요. 새로고침하면 처음부터 실행합니다.</p>
    <p><label for="user">아이디 연습</label><input id="user"></p>
    <p><label for="pw">비밀번호 연습</label><input id="pw" type="password"></p>
    <button id="check" type="button">연습 확인</button>
    <div id="game">이동 상자</div>
    <p>스크롤 위치: <span id="position">0</span></p>
    <button id="top" type="button">맨 위로</button>
    <script src="15-02_JavaScript_키보드와_스크롤.js"></script>
</body>
</html>
