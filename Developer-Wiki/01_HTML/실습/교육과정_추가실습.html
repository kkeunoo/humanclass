<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학습 과정 안내 — 추가 실습</title>
</head>
<body>
    <header>
        <h1>학습 과정 안내</h1>
        <nav aria-label="주요 메뉴">
            <a href="#courses">과정</a>
            <a href="#consultation">상담 연습</a>
        </nav>
    </header>
    <main>
        <section id="courses">
            <h2>학습 과정</h2>
            <article>
                <h3>HTML 기초</h3>
                <p>문서의 구조와 폼 전송을 공부합니다.</p>
            </article>
            <article>
                <h3>CSS 기초</h3>
                <p>색상·크기·배치를 공부합니다.</p>
            </article>
        </section>
        <section id="consultation">
            <h2>상담 연습</h2>
            <p>실제 상담이 접수되지 않는 예제입니다. 연습용 값만 입력하세요.</p>
            <form method="get">
                <fieldset>
                    <legend>연락 정보</legend>
                    <p>
                        <label for="name">이름</label>
                        <input id="name" name="name" type="text" required>
                    </p>
                    <p>
                        <label for="email">이메일</label>
                        <input id="email" name="email" type="email" required>
                    </p>
                </fieldset>
                <button type="submit">입력 형식 확인</button>
            </form>
        </section>
    </main>
    <aside>
        <h2>먼저 확인할 내용</h2>
        <p>기본편의 name과 value를 이해한 뒤 확장합니다.</p>
    </aside>
    <footer>
        <p>작성일 <time datetime="2026-09-18">2026년 9월 18일</time></p>
    </footer>
</body>
</html>
