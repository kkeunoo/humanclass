<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>학습 기록의 영역</title>
</head>
<body>
    <header>
        <h1>학습 기록</h1>
        <nav>
            <a href="#today">오늘 배운 내용</a>
            <a href="#review">복습</a>
        </nav>
    </header>
    <main>
        <section id="today">
            <h2>오늘 배운 내용</h2>
            <article>
                <h3>폼의 name과 value</h3>
                <p>보이는 글자와 전송 값을 구분했다.</p>
            </article>
        </section>
        <section id="review">
            <h2>복습</h2>
            <p>입력 상태와 제출 항목을 다시 확인한다.</p>
        </section>
    </main>
    <aside>
        <h2>관련 공부</h2>
        <p>다음에는 CSS로 배치를 정리한다.</p>
    </aside>
    <footer>
        <p>나의 공부 기록</p>
    </footer>
</body>
</html>
