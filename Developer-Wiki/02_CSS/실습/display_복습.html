<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS 수업 복습</title>
    <style>
        body { margin: 0; }
        .wrapper {
            width: 90%;
            margin: 20px auto;
            padding: 20px 0;
            background-color: #eeeeee;
            text-align: center;
        }
        .content {
            display: inline-block;
            width: 45%;
            min-width: 200px;
            box-sizing: border-box;
            border: 1px solid gray;
            padding: 20px;
            vertical-align: top;
            text-align: left;
        }
        .left {
            margin-right: 20px;
            background-color: #abcdef;
        }
        .right { background-color: white; }
        button {
            width: 120px;
            height: 40px;
            border: 1px solid gray;
            background-color: white;
        }
        button:hover { background-color: #abcdef; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="content left">
            <h1>CSS 복습</h1>
            <p>박스 크기와 줄바꿈을 확인합니다.</p>
        </div>
        <div class="content right">
            <h2>확인할 내용</h2>
            <ol>
                <li>너비와 padding</li>
                <li>좌우 margin과 공백</li>
                <li>좁은 화면의 줄바꿈</li>
            </ol>
            <button type="button">연습 버튼</button>
        </div>
    </div>
</body>
</html>
