<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        window.onload = ()=> {
            document.querySelector('#btn1').addEventListener('click', ()=> {
                console.log(location)
                // 현재 주소를 알아낼 수 있는 변수
                console.log(location.href)
                // 아래와 같이 읽어 온 주소의 값을 바꿀수도 있음
                location.href = 'http://naver.com'
            })

            document.querySelector('#btn2').addEventListener('click', ()=> {
                // reload()를 사용해서 새로고침을 할 수 있음
                location.reload()
            })

            document.querySelector('#btn3').addEventListener('click', ()=> {
                console.log(history)

                // 뒤로 한 칸 가겠다는 함수
                // history.back()
                history.go(-2)
            })

            document.querySelector('#btn4').addEventListener('click', ()=> {
                const url = '17_event_form.html'
                const name = 'open 연습'
                let option = 'width=800,height=600'

                // 새로운 팝업창을 하나 띄울 수 있고 iframe처럼 보안에 좋지 않음
                // 옵션값으로 속성을 줄 수 있고 부모가 뭐 하는지 다 알 수 있음
                window.open(url, name, option)
            })

            document.querySelector('#btn5').addEventListener('click', ()=> {
                new kakao.Postcode({
                    oncomplete: function(data) {
                        console.log(data)
                        console.log(data.address)
                        console.log(data.zonecode)
                    }
                }).open();
            })
        }
    </script>
</head>
<body>
    <button type="button" id="btn1">네이버로 이동</button>
    <button type="button" id="btn2">새로고침</button>
    <button type="button" id="btn3">뒤로가기</button>
    <button type="button" id="btn4">open</button>
