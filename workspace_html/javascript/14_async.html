<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script>
            // 아래처럼 보았을 때 fn1을 선언하고 fn1()실행하면 동기화 상태
            // fn2가 따로 해도 되지만, fn1안에 넣었을 때 한 번에 같이 실행되기 때문에
            // 해당 상태도 동기화라고 볼 수 있음 (끝나자마자 다른일이 시작)
            function fn1() {
                console.log('fn1 실행')

                fn2()
            }
            function fn2() {
                console.log('fn2 실행')

                fn3()
                fn3()

                console.log('1')
                // 3이 먼저 나오는 이유는 setTimeout은 '0초 이후' 라는 개념이기 때문에,
                // 1-3-2 순서로 출력되게 됨 (이 모습이 동기화가 안 되어있는 것)
                // setTimeout( function() {
                //     console.log('2')
                // }, 0)
                // console.log('3')

                // 아래와 같이 주었을 때는 같은 setTimeout이기 때문에,
                // '마지막'이 먼저 나오고 2, 3 순으로 나오게 됨
                // 이러한 것 때문에 지연함수라고 부르며, 두 번째 인자값을 주는 것
                // 같은 setTimeout 0 이라면 두개는 동기화가 된 것
                setTimeout( function() {
                    console.log('2')
                }, 0)
                setTimeout( function() {
                    console.log('3')
                }, 0)
                console.log('마지막')
            }
            function fn3() {
                console.log('fn3 실행')
            }

            fn1()
            // fn2()

        </script>
    </head>
    <body>
        
    </body>
</html>
