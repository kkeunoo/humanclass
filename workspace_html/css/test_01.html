<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            /* * {
                border: 2px solid red;
                box-sizing: border-box;
            } */

            body {
                margin: 0;
                
            }

            .main {
                background-image: url("https://html5up.net/uploads/demos/tessellate/images/header.jpg");
                background-size: cover;
                background-repeat: no-repeat;
                background-position: center;

                height: 600px;

                color: white;

                text-align: center;
            }

            .main .d1 {
                display: inline-block;
                margin-top: 200px;

                font-size: 30px;
            }

            .main .d2 {
                margin: 30px 0;
            }

            .main .d2 .up {
                border: 0;
                color: white;

                text-decoration-line: none;
                font-size: 18px;

                border-bottom: 1px dotted white;
            }

            .main .d3 {
                display:inline-block;

                border: 1px solid white;
                border-radius: 5px;

                width: 300px;
                min-width: 300px;
                height: 50px;

                background-color: rgba(255,255,255,0.2);
            }

            .main .d3:hover {
                background-color: rgba(255,255,255,0.4);
            }
        </style>
    </head>
    <body>
        <div class="main">
            <div class="d1">Welcome to Tessellate</div>
            <div class="d2">A free responsive site template by <a href=# class="up">HTML5 UP</a></div>
            <div class="d3">Proceed to second phase</div>
        </div>
    </body>
</html>
